tools:
  search_places:
    description: >-
      Найти физические места для посещения: кафе, бары, рестораны, кальянные,
      клубы, достопримечательности и другие заведения. Используй только когда
      пользователь хочет подобрать или сравнить места. Если город не указан в
      текущем сообщении и не известен однозначно из истории диалога, сначала
      спроси пользователя, в каком городе искать, и НЕ вызывай инструмент.
      После ответа пользователя используй названный город вместе с сохранёнными
      критериями предыдущего запроса. Район, метро или адрес без однозначно
      известного города не считай достаточной локацией.
    parameters:
      query: >-
        Что нужно найти и все известные пожелания пользователя: категория,
        бюджет, атмосфера, время работы и другие критерии. Не добавляй условий,
        которых пользователь не называл.
      location: >-
        Обязательно укажи город и, если известно, район, метро или адрес. Не
        передавай «рядом», «здесь» или «рядом со мной» вместо города.
      limit: Количество вариантов от 1 до 10; по умолчанию 5.
  send_meme:
    description: >-
      Отправить в чат готовый мем через Humor API. Если пользователь просит
      просто любой мем и не называет тему, ОБЯЗАТЕЛЬНО используй mode=random без
      keywords. Используй mode=search только при наличии конкретной темы. Для
      search ОБЯЗАТЕЛЬНО переведи тему пользователя на английский и передай ровно
      одно широкое английское ключевое слово в keywords. Никогда не передавай
      русские слова или несколько слов в keywords. Не вызывай инструмент без
      уместного повода.
    parameters:
      mode: >-
        Используй random для просьбы прислать любой мем без указанной темы.
        Используй search только для явно указанной темы.
      keywords: >-
        Ровно одно широкое английское ключевое слово. Сам переведи сюда тему
        пользователя с любого языка. Обязательно для search и не передаётся для
        random.
  create_calendar_event:
    description: >-
      Создать событие в календаре текущего Telegram-чата. Вызывай только когда
      однозначно известны название, локальная дата и время. Если пользователь
      попросил напоминание, но не указал момент, сначала задай уточняющий вопрос.
      Никогда не передавай chat_id или user_id. Относительные даты вычисляй по
      доверенным текущим времени и таймзоне из runtime-контекста.
    parameters:
      title: Краткое и конкретное название события.
      description: Дополнительное описание события, только если оно было дано.
      starts_at_local: >-
        Локальные дата и время события строго в формате YYYY-MM-DDTHH:MM:SS без
        UTC-offset. Не вызывай инструмент, если дата или время неоднозначны.
      timezone: >-
        IANA-таймзона, например Europe/Moscow. Не передавай, чтобы использовать
        таймзону календаря из runtime-контекста.
      reminders: >-
        Список напоминаний. Для каждого укажи смещение в минутах и полный итоговый
        текст. Если пользователь перечислил обязательные упоминания, message_text
        обязан содержать их все. Если напоминание не просили, передай пустой список
        или не передавай поле.
  list_calendar_events:
    description: >-
      Показать актуальные события календаря текущего чата и получить их event_id
      и version во внутренних структурированных данных. Используй перед изменением
      или отменой: ищи по характерным словам из пользовательского описания, а не
      требуй точное название. При одном не вполне уверенном совпадении спроси, то
      ли это событие. При нескольких покажи варианты и попроси выбрать. До выбора
      ничего не изменяй и не отменяй.
    parameters:
      starts_from_local: >-
        Начало периода как YYYY-MM-DD или YYYY-MM-DDTHH:MM:SS без UTC-offset. По
        умолчанию используется текущее время.
      starts_until_local: >-
        Исключительная верхняя граница периода как YYYY-MM-DD или локальные дата и
        время без UTC-offset.
      limit: Число событий на странице, по умолчанию 10.
      cursor: >-
        Непрозрачный next_cursor из предыдущего результата. Передавай его без
        изменений, когда пользователь просит показать следующие события. Вместе
        с cursor не передавай границы периода.
      keywords: >-
        От одного до пяти характерных слов для поиска по названию и описанию.
        Передавай основы значимых слов из формулировки пользователя, а не точное
        название целиком: например ["ветеринар"] или ["договор", "Анна"]. Не
        добавляй предлоги. Если ничего не найдено, повтори поиск с меньшим числом
        или более общими ключевыми словами.
  get_calendar_event:
    description: >-
      Получить полные и актуальные данные одного события текущего чата по event_id.
      Используй перед изменением или отменой, чтобы получить текущую version.
    parameters:
      event_id: UUID события, ранее полученный из календарного инструмента.
  add_calendar_reminders:
    description: >-
      Добавить одно или несколько напоминаний к однозначно выбранному активному
      событию, не удаляя уже существующие. Используй этот инструмент, когда
      пользователь просит «добавить», «поставить» или «создать» напоминание для
      существующего события. Перед вызовом найди событие и при необходимости
      получи подтверждение пользователя. Никогда не сообщай об успешном добавлении
      до успешного результата этого инструмента.
    parameters:
      event_id: UUID однозначно выбранного события из служебных данных.
      expected_version: Актуальная version из служебных данных.
      reminders: >-
        Только новые напоминания, которые нужно добавить. Для каждого укажи
        смещение в минутах и полный итоговый текст сообщения.
  update_calendar_event:
    description: >-
      Изменить выбранное активное событие текущего чата. Требуются актуальные
      event_id и version. Передавай только изменяемые поля. Если меняешь
      напоминания, передай полный новый список; пустой список удаляет будущие
      напоминания. Не выбирай событие наугад при нескольких совпадениях.
    parameters:
      event_id: UUID однозначно выбранного события.
      expected_version: Актуальная version из get_calendar_event или списка.
      title: Новое название; не передавай, если оно не меняется.
      description: Новое описание; null очищает описание.
      starts_at_local: >-
        Новые локальные дата и время в формате YYYY-MM-DDTHH:MM:SS без UTC-offset.
      timezone: >-
        Новая IANA-таймзона. Передавай только вместе с starts_at_local.
      reminders: >-
        Полный новый список будущих напоминаний с итоговыми текстами. Не передавай,
        если напоминания не меняются.
  cancel_calendar_event:
    description: >-
      Отменить однозначно выбранное активное событие текущего чата и его будущие
      напоминания. Требуются актуальные event_id и version. При неоднозначности
      сначала запроси список и попроси пользователя выбрать событие.
    parameters:
      event_id: UUID однозначно выбранного события.
      expected_version: Актуальная version отменяемого события.
