tools:
  send_meme:
    description: >-
      Отправить в чат готовый мем через Humor API. Если пользователь просит
      просто любой мем и не называет тему, ОБЯЗАТЕЛЬНО используй mode=random без
      keywords. Используй mode=search только при наличии конкретной темы. Для
      search ОБЯЗАТЕЛЬНО переведи тему пользователя на английский и передай ровно
      одно широкое английское ключевое слово в keywords. Никогда не передавай
      русские слова или несколько слов в keywords. Не вызывай инструмент без
      уместного повода.
    parameters:
      mode: >-
        Используй random для просьбы прислать любой мем без указанной темы.
        Используй search только для явно указанной темы.
      keywords: >-
        Ровно одно широкое английское ключевое слово. Сам переведи сюда тему
        пользователя с любого языка. Обязательно для search и не передаётся для
        random.
