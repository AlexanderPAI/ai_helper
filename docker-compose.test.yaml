name: ai-helper-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_helper_test
      POSTGRES_USER: ai_helper_test
      POSTGRES_PASSWORD: ai_helper_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_helper_test -d ai_helper_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
